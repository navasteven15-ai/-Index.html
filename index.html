<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plants vs Zombies - Pro Version</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1b5e20,#4caf50);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

header{
    padding:30px;
    background:#0d3b12;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

h1{
    font-size:45px;
    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px yellow; }
    to{ text-shadow:0 0 25px orange; }
}

section{
    padding:30px;
}

.card{
    display:inline-block;
    background:rgba(0,0,0,0.3);
    border-radius:20px;
    padding:20px;
    margin:20px;
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover{
    transform: scale(1.1);
    box-shadow:0 10px 20px rgba(0,0,0,0.6);
}

img{
    width:200px;
    border-radius:15px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:yellow;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

button:hover{
    background:orange;
    transform:scale(1.1);
}

footer{
    background:#0d3b12;
    padding:15px;
    margin-top:40px;
}

/* Animación zombie flotando */
.zombie{
    position:absolute;
    bottom:0;
    left:-200px;
    width:150px;
    animation: walk 15s linear infinite;
}

@keyframes walk{
    from{ left:-200px; }
    to{ left:100%; }
}
</style>
</head>

<body>

<header>
    <h1>🌱 Plants vs Zombies 🧟</h1>
    <p>Defiende tu jardín con estrategia</p>
</header>

<section>

<div class="card">
    <h2>🌻 Girasol</h2>
    <img src="https://upload.wikimedia.org/wikipedia/en/7/7c/Sunflower_PvZ.png">
    <p>Produce el sol necesario para plantar más defensas.</p>
</div>

<div class="card">
    <h2>🌱 Lanzaguisantes</h2>
    <img src="https://upload.wikimedia.org/wikipedia/en/3/3e/Peashooter_PvZ.png">
    <p>Ataca a los zombis disparando guisantes.</p>
</div>

<div class="card">
    <h2>🧟 Zombi</h2>
    <img src="https://upload.wikimedia.org/wikipedia/en/4/45/Basic_Zombie_PvZ.png">
    <p>Intenta invadir tu casa… ¡detenlo!</p>
</div>

<br>

<button onclick="alert('¡Los zombis están atacando! Prepárate 🌱🧟‍♂️')">
Iniciar Defensa
</button>

</section>

<!-- Zombie animado -->
<img class="zombie" src="https://upload.wikimedia.org/wikipedia/en/4/45/Basic_Zombie_PvZ.png">

<!-- Música de fondo -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b3f84.mp3" type="audio/mpeg">
</audio>

<footer>
    <p>Proyecto gamer creado por Steven 🚀</p>
</footer>

</body>
</html>
